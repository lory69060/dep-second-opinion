name: dep-second-opinion

# Formal delivery shell: GitHub Actions (not Cursor Automation).
# Comments appear as github-actions[bot]; PR emails are GitHub notifications.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "src/**"
      - "scripts/github-pr-review.sh"
      - ".github/workflows/dep-second-opinion.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install
          else
            npm install
          fi

      - name: Build analyzer
        run: |
          if command -v pnpm >/dev/null 2>&1 && [ -f pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi

      - name: Review dependency changes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/github-pr-review.sh
